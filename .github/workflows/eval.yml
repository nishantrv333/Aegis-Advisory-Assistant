name: eval

# Proof the project runs. Every push regenerates the synthetic data from
# scratch, builds the vector index, and runs the golden set end to end,
# so the badge in the README reflects a real execution, not a claim.
#
# It runs in deterministic mode (mock LLM, offline embedder) so it needs no
# API key and no secrets. That is the same mode anyone cloning the repo gets
# for free, which is the point: if CI is green, a clone works.
#
# One case (G07) is expected to fail on retrieval. That is recorded in
# eval/golden_set.py, so the suite still exits zero for it but fails for
# anything else, and tells me if G07 ever starts passing.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic data
        run: |
          python data/generate_data.py
          python data/generate_corpus.py

      - name: Check every module imports
        run: python -m compileall -q .

      - name: Verify the MCP server responds over stdio
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | python -m mcp_layer.stdio_server portfolio \
            | tee /dev/stderr | grep -q 'portfolio.get_client_profile'

      - name: Retrieval eval
        env:
          EMBEDDING_MODE: hash
        run: python eval/run_eval.py --retrieval-only --no-colour

      - name: Golden set
        env:
          EMBEDDING_MODE: hash
          LLM_PROVIDER: mock
        run: python eval/run_eval.py --no-colour

      - name: Compliance rules must be exactly correct
        env:
          EMBEDDING_MODE: hash
          LLM_PROVIDER: mock
        run: python eval/check_compliance.py

      - name: Smoke-test the API
        env:
          EMBEDDING_MODE: hash
          LLM_PROVIDER: mock
        run: |
          uvicorn main:app --port 8000 &
          for i in $(seq 1 30); do
            curl -sf localhost:8000/api/health > /dev/null && break
            sleep 2
          done
          curl -sf localhost:8000/api/health
          curl -sf -X POST localhost:8000/api/briefing \
            -H 'content-type: application/json' \
            -d '{"client_id":"4526","query":"Client wants Bramble private credit"}' \
            | python -c "import sys,json; d=json.load(sys.stdin); assert d['briefing']['compliance']['status']=='fail'; assert len(d['trace'])>20; print('API ok:', len(d['trace']), 'trace events')"
